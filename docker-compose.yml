# ────────────────────────────────────────────────────────────────────────────
# CartSense — Docker Compose
# Services: postgres | mlflow | init (data gen + training) | backend | frontend
# ────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg2://cartsense_user:cartsense_pass@postgres_db:5432/cartsense
  MLFLOW_TRACKING_URI: http://mlflow_server:5000
  ARTIFACTS_DIR: /app/artifacts
  TFIDF_MODEL_NAME: CartSense_TFIDF
  ALS_MODEL_NAME: CartSense_ALS
  ALPHA: "0.65"
  BETA: "0.20"
  TOP_K: "5"
  ALS_RANK: "20"
  ALS_MAX_ITER: "15"
  ALS_REG_PARAM: "0.1"
  ALS_SEED: "42"
  DRIFT_THRESHOLD: "0.75"
  GIT_PYTHON_REFRESH: quiet
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres_db:
    image: postgres:15-alpine
    container_name: cartsense_postgres
    environment:
      POSTGRES_DB: cartsense
      POSTGRES_USER: cartsense_user
      POSTGRES_PASSWORD: cartsense_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cartsense_user -d cartsense" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cartsense_net

  # ── MLflow Tracking Server ──────────────────────────────────────────────────
  mlflow_server:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    image: cartsense-mlflow:2.16.2
    container_name: cartsense_mlflow
    working_dir: /app
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://cartsense_user:cartsense_pass@postgres_db:5432/cartsense
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    command:
      - sh
      - -c
      - >-
        exec mlflow server
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --default-artifact-root "$$MLFLOW_ARTIFACT_ROOT"
        --host 0.0.0.0
        --port 5000
        --workers 4
    ports:
      - "5000:5000"
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\"" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cartsense_net
    restart: unless-stopped

  # ── Init: Data Generation + Model Training ──────────────────────────────────
  # Runs once, generates data and trains models, then exits
  cartsense_init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cartsense_init
    working_dir: /app
    volumes:
      - ./:/app
      - artifacts_data:/app/artifacts
    environment:
      <<: *common-env
    command: >
      sh -c "
        echo '=== CartSense Init: Waiting for DB...' &&
        sleep 10 &&
        echo '=== Step 1: Generate data ===' &&
        python training/generate_data.py &&
        echo '=== Step 2: Train TF-IDF ===' &&
        python training/train_tfidf.py &&
        echo '=== Step 3: Train ALS ===' &&
        python training/train_als.py &&
        echo '=== Init complete ==='
      "
    depends_on:
      postgres_db:
        condition: service_healthy
      mlflow_server:
        condition: service_healthy
    networks:
      - cartsense_net
    restart: "no"

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  fastapi_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cartsense_backend
    working_dir: /app
    volumes:
      - ./:/app
      - artifacts_data:/app/artifacts
    environment:
      <<: *common-env
      BACKEND_URL: http://fastapi_backend:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
      mlflow_server:
        condition: service_healthy
      cartsense_init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cartsense_net

  # ── React Dashboard ─────────────────────────────────────────────────────────
  streamlit_frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cartsense_frontend
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules   # keep container's Linux node_modules; don't let host Windows copy shadow it
    environment:
      FASTAPI_URL: http://fastapi_backend:8000
      VITE_PROXY_TARGET: http://fastapi_backend:8000
      PORT: "3000"
    ports:
      - "3000:3000"
      - "5173:3000"
    depends_on:
      fastapi_backend:
        condition: service_healthy
    networks:
      - cartsense_net

volumes:
  postgres_data:
  mlflow_artifacts:
  artifacts_data:

networks:
  cartsense_net:
    driver: bridge
